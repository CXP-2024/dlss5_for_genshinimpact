[ADDON]
; Replace this placeholder with the Add-ons directory beside the active ReShade install.
; Use one directory containing dlss5-dx11-bridge.addon64 and renodx-dlss5.addon64.
AddonPath=<游戏目录>\\reshade-shaders\\Addons
DisabledAddons=

[GENERAL]
; Keep the cache in a user-writable temporary directory.
IntermediateCachePath=%TEMP%\\ReShade
NoDebugInfo=1
NoEffectCache=0
NoReloadOnInit=0
PerformanceMode=0
SkipLoadingDisabledEffects=1
