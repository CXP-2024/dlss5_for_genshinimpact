[NRBeforeSR]
; F6 toggles Enabled. Mode 1 is SR -> output-resolution NR (default).
; Mode 2 is render-resolution NR -> original SR.
; Render resolution always follows the game's DLSS quality setting.
; NR Detail Blend is shared by both chains and is not a scaling ratio.
; ColorStrength=0 keeps the game's hue while retaining NR luminance detail.
ConfigVersion=3
Enabled=1
Mode=2
IdentityUseOriginalColor=0
TransferStrength=1.00
PostTransferStrength=1.00
ColorStrength=0.00
MaxLumaRatio=2.00
PreserveLighting=0
ProxyScale=1.0
WarmupAfterCreate=2
RetryOriginalOnSRFailure=1
DepthMode=-1
Intensity=1.0
LocalToneStrength=1.0
LocalStructureStrength=1.0
SkinStructureStrength=-1.0
AutoMask=0
Style=0
UICorrection=0
PerfEpoch=0
