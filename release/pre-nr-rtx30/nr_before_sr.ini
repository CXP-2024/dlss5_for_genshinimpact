[NRBeforeSR]
; F6 toggles Enabled. Mode 2 (render-resolution NR -> original DLSS SR) is the safe default.
; Clear "Use render-resolution NR -> SR" in the add-on UI for Mode 1:
; original DLSS SR -> output-resolution NR. The launcher preserves this choice.
; Render resolution follows the game's DLSS quality setting.
ConfigVersion=3
Enabled=1
Mode=2
IdentityUseOriginalColor=0
TransferStrength=1
PostTransferStrength=1
ColorStrength=0
MaxLumaRatio=2
PreserveLighting=0
ProxyScale=1
WarmupAfterCreate=2
RetryOriginalOnSRFailure=1
DepthMode=-1
Intensity=2
LocalToneStrength=1
LocalStructureStrength=1
SkinStructureStrength=-1
AutoMask=0
Style=0
UICorrection=0
PerfEpoch=0
